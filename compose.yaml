name: rixin-club-local

services:
  web:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:5174:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"

volumes:
  node_modules:
