name: Website checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify automatic deployment trigger behavior
        run: node --test scripts/trigger-flow.test.mjs
      - name: Verify runtime lifecycle and pioneer name search
        run: npm run test:runtime
      - name: Build and verify static files and map behavior
        run: npm run build
        env:
          BUILD_VCS_NUMBER: ${{ github.sha }}
      - name: Trigger Flow and verify the production revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/trigger-flow.mjs
        env:
          CLUB_FLOW_WEBHOOK_URL: ${{ secrets.CLUB_FLOW_WEBHOOK_URL }}
