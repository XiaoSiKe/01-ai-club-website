# 仅管理 club.01aiedu.com，不修改默认入口和其它 server 块。
server {
    listen 80;
    server_name club.01aiedu.com;
    access_log /var/log/nginx/01aiclub.access.log;
    error_log /var/log/nginx/01aiclub.error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/01aiclub/acme;
        try_files $uri =404;
    }
    location / { return 308 https://club.01aiedu.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name club.01aiedu.com;
    ssl_certificate /etc/letsencrypt-01aiclub/live/01aiclub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-01aiclub/live/01aiclub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/01aiclub/current;
    index index.html;
    access_log /var/log/nginx/01aiclub.access.log;
    error_log /var/log/nginx/01aiclub.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ~ /\. { deny all; }
    location = /version.json {
        add_header Cache-Control 'no-store';
        try_files $uri =404;
    }
    location ^~ /assets/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
