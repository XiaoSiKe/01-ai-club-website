# TLS 签发前的独立入口；精确匹配日新社域名，不占用默认站点。
server {
    listen 80;
    server_name club.01aiedu.com;
    root /var/www/01aiclub/current;
    index index.html;
    access_log /var/log/nginx/01aiclub.access.log;
    error_log /var/log/nginx/01aiclub.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/01aiclub/acme;
        try_files $uri =404;
    }
    location = /version.json {
        add_header Cache-Control 'no-store';
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
